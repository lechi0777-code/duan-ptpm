<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án đầu tiên của tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8f5e9;
            padding: 50px 20px;
        }

        h1 {
            color: #237a3b;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            background-color: #237a3b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Chào mừng đến với dự án của tôi!</h1>
    <p>Đây là trang web đầu tiên tôi tự tạo.</p>

    <button onclick="alert('Bạn đã tạo thành công trang web!')">
        Bấm vào đây
    </button>
</body>
</html>
